[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chessfly"
version = "0.1.0"
description = "Pure biological connectome chess engine simulated using Drosophila melanogaster nervous system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "chess>=1.11.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pyarrow>=16.0.0",
]

[project.scripts]
chessfly-uci = "chessfly.uci:run_uci"

[tool.setuptools.packages.find]
where = ["."]
include = ["chessfly*"]
